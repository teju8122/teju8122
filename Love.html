<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Question ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:#ff3366;
    margin-bottom:20px;
}

img{
    width:220px;
    border-radius:15px;
    margin-bottom:20px;
}

.buttons{
    position:relative;
    height:180px;
}

button{
    padding:14px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

#yes{
    background:#28a745;
    color:white;
    margin-right:20px;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
    left:220px;
    top:0;
}

#message{
    display:none;
    margin-top:25px;
    color:#ff0066;
    font-size:28px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Will You Be My Husband? ❤️</h1>

<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">

<div class="buttons">

<button id="yes">Yes ❤️</button>

<button id="no">No 💔</button>

</div>

<div id="message">
💖 Yay!! You made me the happiest person! 💖
</div>

</div>

<script>

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", () => {

const maxX = window.innerWidth - noBtn.offsetWidth - 20;
const maxY = window.innerHeight - noBtn.offsetHeight - 20;

const x = Math.random() * maxX;
const y = Math.random() * maxY;

noBtn.style.position = "fixed";
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

});

document.getElementById("yes").onclick = () => {

document.querySelector(".buttons").style.display="none";

document.getElementById("message").style.display="block";

};

</script>

</body>
</html>
